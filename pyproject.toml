[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "wardenauthz"
version = "1.0.0"
description = "Python SDK for WardenAuthz managed authorization API"
requires-python = ">=3.9"
license = {text = "MIT"}
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://wardenauthz.com"
Documentation = "https://docs.wardenauthz.com"
Repository = "https://github.com/ecarrizo2/wardenauthz-python"
Issues = "https://github.com/ecarrizo2/wardenauthz-python/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock>=3.0"]
